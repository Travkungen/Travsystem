name: Phase 2 OOS backtest

on:
  workflow_dispatch:
    inputs:
      snapshot_dir:
        description: "Repository-relative directory containing real historical snapshots"
        required: false
        default: "snapshots"
        type: string
      snapshot_url:
        description: "Optional public ZIP URL containing the real historical snapshots"
        required: false
        default: ""
        type: string
      snapshot_sha256:
        description: "Optional SHA-256 for the snapshot ZIP"
        required: false
        default: ""
        type: string
  pull_request:
    branches: [main]
    paths:
      - "phoenix15/**"
      - ".github/workflows/phase2-oos-backtest.yml"

permissions:
  contents: read

jobs:
  verify-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SNAPSHOT_DIR: ${{ github.event.inputs.snapshot_dir || 'snapshots' }}
      SNAPSHOT_URL: ${{ github.event.inputs.snapshot_url || '' }}
      SNAPSHOT_SHA256: ${{ github.event.inputs.snapshot_sha256 || '' }}
      OUTPUT_DIR: phase2-reports
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install read-only harness dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow pytest

      - name: Verify harness mechanics
        run: python -m pytest phoenix15/test_phase2_backtest.py -q

      - name: Acquire real snapshots
        id: snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_DIR}"
          # Always create the default/selected directory so an absent snapshot
          # bundle is reported as BLOCKED_NO_SNAPSHOTS rather than failing find.
          mkdir -p "${SNAPSHOT_DIR}"

          if [ -n "${SNAPSHOT_URL}" ]; then
            tmp="/tmp/phoenix15_snapshots.zip"
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 300 "${SNAPSHOT_URL}" -o "${tmp}"
            if [ -n "${SNAPSHOT_SHA256}" ]; then
              echo "${SNAPSHOT_SHA256}  ${tmp}" | sha256sum -c -
            fi
            unzip -q "${tmp}" -d "${SNAPSHOT_DIR}"
          fi

          count=$(find "${SNAPSHOT_DIR}" -type f \( -name '*.csv' -o -name '*.json' -o -name '*.parquet' -o -name '*.pq' \) | wc -l)
          if [ "${count}" -eq 0 ]; then
            python - <<'PY'
          import json, os
          with open(os.path.join(os.environ["OUTPUT_DIR"], "PHASE2_ENVIRONMENT_STATUS.json"), "w", encoding="utf-8") as f:
              json.dump({
                  "status": "BLOCKED_NO_SNAPSHOTS",
                  "snapshot_dir": os.environ["SNAPSHOT_DIR"],
                  "message": "No real historical snapshot files were available. No OOS performance result was produced.",
                  "next_step": "Provide the real Phoenix 15 snapshot bundle via snapshot_url or commit it under snapshot_dir."
              }, f, indent=2)
          PY
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found $count snapshot files."
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Run real historical OOS harness
        if: steps.snapshots.outputs.available == 'true'
        run: |
          python phoenix15/PHOENIX15_PHASE2_BACKTEST.py \
            --input "${SNAPSHOT_DIR}" \
            --output "${OUTPUT_DIR}"

      - name: Upload verification or OOS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-oos-report
          path: phase2-reports/
          if-no-files-found: warn
