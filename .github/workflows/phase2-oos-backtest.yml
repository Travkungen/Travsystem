name: Phase 2 OOS backtest

on:
  workflow_dispatch:
    inputs:
      snapshot_dir:
        description: "Repository-relative directory containing real historical snapshots"
        required: true
        default: "snapshots"
        type: string
  pull_request:
    branches: [main]
    paths:
      - "phoenix15/**"
      - ".github/workflows/phase2-oos-backtest.yml"

permissions:
  contents: read

jobs:
  verify-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNAPSHOT_DIR: ${{ github.event.inputs.snapshot_dir || 'snapshots' }}
      OUTPUT_DIR: phase2-reports
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install read-only harness dependencies
        run: python -m pip install --disable-pip-version-check pandas pyarrow pytest

      - name: Verify harness mechanics
        run: python -m pytest phoenix15/test_phase2_backtest.py -q

      - name: Verify snapshot environment
        id: snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${OUTPUT_DIR}"
          if [ ! -d "${SNAPSHOT_DIR}" ]; then
            python - <<'PY'
          import json, os
          with open(os.path.join(os.environ["OUTPUT_DIR"], "PHASE2_ENVIRONMENT_STATUS.json"), "w") as f:
              json.dump({
                  "status": "BLOCKED_NO_SNAPSHOTS",
                  "snapshot_dir": os.environ["SNAPSHOT_DIR"],
                  "message": "No historical snapshot directory is available in this GitHub Actions checkout. No OOS backtest was run and no performance result was produced."
              }, f, indent=2)
          PY
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Run real historical OOS harness
        if: steps.snapshots.outputs.available == 'true'
        run: |
          python phoenix15/PHOENIX15_PHASE2_BACKTEST.py \
            --input "${SNAPSHOT_DIR}" \
            --output "${OUTPUT_DIR}"

      - name: Upload verification or OOS report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-oos-report
          path: phase2-reports/
          if-no-files-found: warn
