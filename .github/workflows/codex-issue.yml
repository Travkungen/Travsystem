name: Codex issue worker

on:
  issues:
    types: [opened, labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  codex:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'codex:run'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Run Codex
        id: run_codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt-file: .github/codex/prompts/issue-worker.md

      - name: Create branch and PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          CODEX_MESSAGE: ${{ steps.run_codex.outputs.final-message }}
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet; then
            echo "Codex made no file changes."
            exit 0
          fi

          BRANCH="codex/issue-${ISSUE_NUMBER}"
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Codex: issue #${ISSUE_NUMBER}"
          git push --set-upstream origin "$BRANCH"

          PR_URL="$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Codex: issue #${ISSUE_NUMBER} — ${ISSUE_TITLE}" \
            --body "$(cat <<EOF
Automated Codex work for issue #${ISSUE_NUMBER}.

Codex final report:
${CODEX_MESSAGE}
EOF
)" )"

          gh issue comment "$ISSUE_NUMBER" --body "Codex completed a run and created PR: $PR_URL"
