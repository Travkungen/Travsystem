name: Phoenix Football CI

on:
  push:
    branches:
      - phoenix-football-scanner
    paths:
      - "phoenix_football/**"
      - ".github/workflows/phoenix-football-ci.yml"
  pull_request:
    paths:
      - "phoenix_football/**"
      - ".github/workflows/phoenix-football-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phoenix_football
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run sample scan
        run: python -m phoenix_football.scanner scan --input data/odds_sample.csv --output reports/ci_scan.csv
      - name: Verify report
        run: test -s reports/ci_scan.csv
